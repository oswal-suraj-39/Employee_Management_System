<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: poppins, sans-serif;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        row-gap: 0.5rem
    }

    header {
        display: flex;
        width: 100%;
        height: 4rem;
        align-items: center;
        padding-left: 1rem;
        background: #16db65;
    }

    section {
        padding: 0.5rem;
    }

    h2 {
        margin-bottom: 0.5rem;
    }

    iframe {
        width: 100%;
        border: 1px solid black;
        border-radius: 0.5rem;
    }

    img {
        width: 100%;
        max-width: 40rem;
        border: 1px solid black;
        border-radius: 0.5rem;
    }

    .photosContainer {
        display: flex;
        flex-direction: row;
        gap: 0.5rem;
    }
    
    .group3 {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
    }

    .group3 img {
        max-width: 20rem;
    }

    @media screen and (max-width: 768px) {
        header {
            height: 3rem;
            font-size: 0.5em;
        }

        .photosContainer {
            flex-direction: column;
        }
    }
</style>

<body>

    <header>
        <h1>Employee Management System Project Demo</h1>
    </header>

    <section id="video">
        <h2>Video</h2>

        <iframe src="https://www.youtube.com/embed/G62ADh3DY0U" title="Employee Management System Project Demo"
            allowfullscreen>
        </iframe>
    </section>

    <section id="photos">
        <h2>Photos</h2>

        <div class="photosContainer">
            <div class="group1">
                <img src="./Screenshot1.png">
                <img src="./Screenshot2.png">
                <img src="./Screenshot3.png">
                <img src="./Screenshot4.png">
            </div>

            <div class="group2">
                <img src="./Screenshot5.png">
                <img src="./Screenshot6.png">
                <img src="./Screenshot7.png">
                <img src="./Screenshot8.png">
            </div>
        </div>

        <div class="group3">
            <img src="./Screenshot9.png">
            <img src="./Screenshot10.png">
            <img src="./Screenshot11.png">
            <img src="./Screenshot12.png">
            <img src="./Screenshot13.png">
            <img src="./Screenshot14.png">
        </div>
    </section>
</body>

</html>
