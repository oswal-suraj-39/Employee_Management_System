<div class="dashboardContainer">

    <header class="header2">
        <div class="clock">
            <div id="time"></div>
            <div id="date"></div>
        </div>
    </header>

    <section class="counterPanel">
        <div class="counterBg">
            <div class="counterIcon"></div>
            <div class="countInfo">
                <p class="cTitle">Total Employee</p>
                <b class="cNumber"></b>
            </div>
        </div>

        <div class="counterBg">
            <div class="counterIcon"></div>
            <div class="countInfo">
                <p class="cTitle">Active Employee</p>
                <b class="cNumber"></b>
            </div>
        </div>

        <div class="counterBg">
            <div class="counterIcon"></div>
            <div class="countInfo">
                <p class="cTitle">Inactive Employee</p>
                <b class="cNumber"></b>
            </div>
        </div>

        <div class="counterBg">
            <div class="counterIcon"></div>
            <div class="countInfo">
                <p class="cTitle">Department</p>
                <b class="cNumber"></b>
            </div>
        </div>
    </section>
    
    <section class="tableContainer">
        
    </section>
    
    <section class="chart-container">
    		<div class="chart-box">
			<canvas id="pie-chart-1"></canvas>
		</div>
		
		<div class="chart-box">
			<canvas id="pie-chart-2"></canvas>
		</div>
		
		<div class="chart-box">
			<canvas id="bar-chart"></canvas>
		</div>
    </section>
</div>
